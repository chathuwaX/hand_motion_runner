<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOTION RUNNER – 3D Hand-Motion Controlled Endless Runner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body>
  <!-- Split Screen 2-Part Container -->
  <div id="app-container" class="split-view">
    <!-- Part 1: 3D Endless Runner Game Screen -->
    <div id="game-panel" class="split-pane game-pane">
      <div id="game-canvas-container"></div>
      <div id="game-hud-mount"></div>
    </div>

    <!-- Center Neon Divider Bar -->
    <div id="split-divider" class="split-divider">
      <div class="divider-line"></div>
      <button id="btn-split-swap" class="divider-swap-btn" title="Swap Game and Tracking Sides">⇄</button>
    </div>

    <!-- Part 2: Human Motion Tracking Screen -->
    <div id="tracking-panel" class="split-pane tracking-pane"></div>

    <!-- Global Fullscreen Modal UI Layer (Menu, Calibration, Pause, Game Over) -->
    <div id="ui-layer"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
